spring.application.name=student-course-registration-api
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/course_registration?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
server.port=8080
